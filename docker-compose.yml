# Proset CE — self-hosted AI voice notes recorder
#
# Usage:
#   cp .env.example .env        # fill in YOUR Firebase + AI provider values
#   docker compose up -d --build
#
# Notes:
#   - Transcription is BYO-key: set ONE provider key in .env (the app routes
#     only to providers with credentials).
#   - Firebase: create a project (Auth Email/Password + Firestore), download
#     the service account JSON and mount it where GOOGLE_APPLICATION_CREDENTIALS
#     points (see the commented volume below).
#   - Recordings store to a Docker volume (proset-data) by default.

services:
  proset:
    build:
      context: .
      args:
        # Your public URL (no trailing slash), e.g. https://voice.example.com
        AIFORMS_PUBLIC_DOMAIN: ${AIFORMS_PUBLIC_DOMAIN:-localhost}
    container_name: proset-ce
    ports:
      - "${PORT:-5000}:5000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    volumes:
      - proset-data:/app/.local/object-storage
      # - ./firebase-service-account.json:/app/firebase-service-account.json:ro
    restart: unless-stopped

volumes:
  proset-data:
