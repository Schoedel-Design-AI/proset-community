name: Bug report
description: Report a problem with Proset CE
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please search
        existing issues first to avoid duplicates.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen, and what actually happened?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this? Include how you run the CE (Docker self-host, local dev, which AI provider).
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: CE version
      description: Release tag (e.g. v1.0.49) or commit SHA
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where does it happen?
      options:
        - Web (browser)
        - Android app
        - Server / API
        - Docker self-host
        - Local dev
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Paste server logs, error messages, or screenshots. NEVER paste API keys or secrets.
    validations:
      required: false
