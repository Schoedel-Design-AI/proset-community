name: CI

on:
  push:
    branches: [main]
  pull_request:

# Supply-chain hardening: read-only token, actions pinned to immutable SHAs.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # actions/checkout v4.4.0 (SHA-pinned)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-node v4.4.0 (SHA-pinned)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint .
      - name: Build server bundle
        run: npm run server:build
      - name: Run tests
        # Contract: these globs must match only test files that ship in the
        # CE. The export's scrub list removes RE-internal tests (billing,
        # tier, e2e against staging) — what ships here is CE-compatible and
        # must stay green. `ls` + an explicit empty-guard keeps a future
        # scrub that empties one pattern from failing the build with a
        # confusing "no files" error or from drifting into Node's default
        # test discovery (which would pick up staging-dependent suites).
        run: |
          files=$(ls tests/lib/*.test.ts tests/server/*.test.ts tests/server/*.test.mjs 2>/dev/null || true)
          if [ -n "$files" ]; then
            node --import tsx --test $files
          else
            echo "No shipped test files match — skipping test run."
          fi
