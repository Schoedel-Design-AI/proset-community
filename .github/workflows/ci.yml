name: CI

on:
  push:
    branches: [main]
  pull_request:

# Supply-chain hardening: read-only token, actions pinned to immutable SHAs.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # actions/checkout v4.4.0 (SHA-pinned)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # actions/setup-node v4.4.0 (SHA-pinned)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint .
      - name: Build server bundle
        run: npm run server:build
      - name: Run tests
        run: node --import tsx --test tests/lib/*.test.ts tests/server/*.test.ts tests/server/*.test.mjs
