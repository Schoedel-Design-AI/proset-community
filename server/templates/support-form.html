<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="head-title">Support — Proset</title>
    <meta name="description" content="Get help with Proset. Submit a support ticket and we'll respond promptly." />
    <meta name="theme-color" content="#0A1628" />
    <meta name="robots" content="noindex" />
    <link rel="stylesheet" href="/landing-page.css?v=12" />

    <!-- Turnstile -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body class="bg-brand-background text-brand-text antialiased font-sans min-h-screen flex flex-col">
    <!-- Nav -->
    <nav class="w-full border-b border-brand-border bg-brand-surface/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="/" class="flex items-center gap-2">
                <img src="/proset-logo.png" alt="Proset Logo" width="40" height="40"
                    class="h-10 w-10 rounded-xl object-cover border border-brand-border/50 shadow-sm" />
                <span class="text-xl font-bold tracking-tight">Proset</span>
            </a>
            <div class="flex items-center gap-4">
                <div class="lang-switcher">
                    <button type="button" id="lang-btn-en" class="lang-btn active" aria-label="Switch language to English" aria-pressed="true">EN</button>
                    <span class="lang-divider">/</span>
                    <button type="button" id="lang-btn-es" class="lang-btn" aria-label="Cambiar idioma a Español" aria-pressed="false">ES</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Form Section -->
    <main class="flex-1 flex items-center justify-center px-4 py-10">
        <div class="w-full max-w-xl support-form-container">
            <!-- Logo + Header -->
            <div class="text-center mb-10">
                <img src="/proset-logo.png" alt="Proset Logo" width="64" height="64"
                    class="mx-auto mb-6 h-16 w-16 rounded-2xl object-cover border border-brand-border/50 shadow-lg" />
                <h1 class="text-3xl md:text-4xl font-bold tracking-tight text-white" data-i18n="form-heading">Get Support</h1>
            </div>

            <form id="support-form" class="support-form bg-brand-surface border border-brand-border p-8 space-y-7">
                <!-- Name -->
                <div>
                    <label for="name" class="block text-sm font-medium text-brand-textSecondary mb-3" data-i18n="field-name">Your Name</label>
                    <input type="text" id="name" name="name" required
                        class="w-full bg-brand-surfaceLight border border-brand-border px-5 py-4 text-brand-text placeholder:text-brand-textMuted outline-none transition-colors focus:border-brand-primary focus:shadow-[0_0_0_4px_rgba(0,180,216,0.15)]"
                        data-i18n-placeholder="placeholder-name" placeholder="Your name" />
                </div>

                <!-- Email -->
                <div>
                    <label for="email" class="block text-sm font-medium text-brand-textSecondary mb-3" data-i18n="field-email">Email Address</label>
                    <input type="email" id="email" name="email" required
                        class="w-full bg-brand-surfaceLight border border-brand-border px-5 py-4 text-brand-text placeholder:text-brand-textMuted outline-none transition-colors focus:border-brand-primary focus:shadow-[0_0_0_4px_rgba(0,180,216,0.15)]"
                        data-i18n-placeholder="placeholder-email" placeholder="you@example.com" />
                </div>

                <!-- Subject -->
                <div>
                    <label for="subject" class="block text-sm font-medium text-brand-textSecondary mb-3" data-i18n="field-subject">Subject</label>
                    <input type="text" id="subject" name="subject" required
                        class="w-full bg-brand-surfaceLight border border-brand-border px-5 py-4 text-brand-text placeholder:text-brand-textMuted outline-none transition-colors focus:border-brand-primary focus:shadow-[0_0_0_4px_rgba(0,180,216,0.15)]"
                        data-i18n-placeholder="placeholder-subject" placeholder="What can we help with?" />
                </div>

                <!-- Category -->
                <div>
                    <label for="category" class="block text-sm font-medium text-brand-textSecondary mb-3" data-i18n="field-category">Category</label>
                    <select id="category" name="category"
                        class="w-full bg-brand-surfaceLight border border-brand-border px-5 py-4 text-brand-textSecondary outline-none transition-colors focus:border-brand-primary focus:shadow-[0_0_0_4px_rgba(0,180,216,0.15)] appearance-none"
                        style="background-image: url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2216%22 height=%2216%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%238BA4C4%22 stroke-width=%222%22><path d=%22M6 9l6 6 6-6%22/></svg>'); background-repeat: no-repeat; background-position: right 1rem center;">
                        <option value="general" data-i18n="cat-general">General Question</option>
                        <option value="account" data-i18n="cat-account">Account / Login Issue</option>
                        <option value="billing" data-i18n="cat-billing">Billing / Subscription</option>
                        <option value="bug" data-i18n="cat-bug">Bug Report</option>
                        <option value="feature" data-i18n="cat-feature">Feature Request</option>
                        <option value="other" data-i18n="cat-other">Other</option>
                    </select>
                </div>

                <!-- Message -->
                <div>
                    <label for="message" class="block text-sm font-medium text-brand-textSecondary mb-3" data-i18n="field-message">Message</label>
                    <textarea id="message" name="message" required rows="6"
                        class="w-full bg-brand-surfaceLight border border-brand-border px-5 py-4 text-brand-text placeholder:text-brand-textMuted outline-none transition-colors focus:border-brand-primary focus:shadow-[0_0_0_4px_rgba(0,180,216,0.15)] resize-y"
                        data-i18n-placeholder="placeholder-message" placeholder="Describe your issue or question..."></textarea>
                </div>

                <!-- Turnstile -->
                <div class="cf-turnstile" data-sitekey="TURNSTILE_SITE_KEY_PLACEHOLDER" data-theme="dark"></div>

                <!-- Submit -->
                <button type="submit" id="submit-btn"
                    class="w-full font-semibold text-lg py-4 transition-all hover:-translate-y-0.5 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:translate-y-0"
                    style="background:#00B4D8; color:#FFFFFF; border:none;"
                    data-i18n="btn-submit">Submit Ticket</button>

                <!-- Status Messages -->
                <div id="form-msg" class="text-sm font-medium text-center hidden"></div>
            </form>

            <!-- Footer -->
            <p class="text-center text-brand-textMuted text-sm mt-6" data-i18n="footer-text">
                Prefer email? Reach us at <a href="mailto:support@proset.ai" class="text-brand-primary hover:underline">support@proset.ai</a>
            </p>
        </div>
    </main>

    <script>
    // === i18n ===
    var lang = (navigator.language || "en").startsWith("es") ? "es" : "en";
    var translations = {
        en: {
            "head-title": "Support \u2014 Proset",
            "nav-home": "\u2190 Proset",
            "nav-lang": "ES",
            "form-heading": "Get Support",
            "field-name": "Your Name",
            "placeholder-name": "Your name",
            "field-email": "Email Address",
            "placeholder-email": "you@example.com",
            "field-subject": "Subject",
            "placeholder-subject": "What can we help with?",
            "field-category": "Category",
            "cat-general": "General Question",
            "cat-account": "Account / Login Issue",
            "cat-billing": "Billing / Subscription",
            "cat-bug": "Bug Report",
            "cat-feature": "Feature Request",
            "cat-other": "Other",
            "field-message": "Message",
            "placeholder-message": "Describe your issue or question...",
            "btn-submit": "Submit Ticket",
            "footer-text": "Prefer email? Reach us at <a href=\"mailto:support@proset.ai\" class=\"text-brand-primary hover:underline\">support@proset.ai</a>",
            "msg-success": "Your ticket has been submitted. We'll respond shortly.",
            "msg-error": "Something went wrong. Please try again or email support@proset.ai.",
            "msg-captcha": "Please complete the CAPTCHA verification.",
            "msg-sending": "Sending..."
        },
        es: {
            "head-title": "Soporte \u2014 Proset",
            "nav-home": "\u2190 Proset",
            "nav-lang": "EN",
            "form-heading": "Obtener Soporte",
            "field-name": "Su Nombre",
            "placeholder-name": "Su nombre",
            "field-email": "Correo Electr\u00f3nico",
            "placeholder-email": "su@ejemplo.com",
            "field-subject": "Asunto",
            "placeholder-subject": "\u00bfEn qu\u00e9 podemos ayudar?",
            "field-category": "Categor\u00eda",
            "cat-general": "Pregunta General",
            "cat-account": "Problema de Cuenta / Inicio de Sesi\u00f3n",
            "cat-billing": "Facturaci\u00f3n / Suscripci\u00f3n",
            "cat-bug": "Reporte de Error",
            "cat-feature": "Solicitud de Funci\u00f3n",
            "cat-other": "Otro",
            "field-message": "Mensaje",
            "placeholder-message": "Describa su problema o pregunta...",
            "btn-submit": "Enviar Ticket",
            "footer-text": "\u00bfPrefiere correo? Cont\u00e1ctenos en <a href=\"mailto:support@proset.ai\" class=\"text-brand-primary hover:underline\">support@proset.ai</a>",
            "msg-success": "Su ticket ha sido enviado. Le responderemos pronto.",
            "msg-error": "Algo sali\u00f3 mal. Intente de nuevo o env\u00ede un correo a support@proset.ai.",
            "msg-captcha": "Por favor complete la verificaci\u00f3n CAPTCHA.",
            "msg-sending": "Enviando..."
        }
    };

    function t(key) { return (translations[lang] && translations[lang][key]) || (translations.en[key] || key); }

    function applyLang() {
        document.querySelectorAll("[data-i18n]").forEach(function(el) {
            var key = el.getAttribute("data-i18n");
            if (el.tagName === "TITLE") { document.title = t(key); }
            else if (el.tagName === "INPUT" || el.tagName === "TEXTAREA") { el.placeholder = t("placeholder-" + key.split("-").slice(1).join("-")) || el.placeholder; }
            else if (el.tagName === "OPTION") { el.textContent = t(key); }
            else { el.innerHTML = t(key); }
        });
        // Update language buttons
        var enBtn = document.getElementById("lang-btn-en");
        var esBtn = document.getElementById("lang-btn-es");
        if (lang === "en") {
            enBtn.classList.add("active"); enBtn.setAttribute("aria-pressed", "true");
            esBtn.classList.remove("active"); esBtn.setAttribute("aria-pressed", "false");
        } else {
            esBtn.classList.add("active"); esBtn.setAttribute("aria-pressed", "true");
            enBtn.classList.remove("active"); enBtn.setAttribute("aria-pressed", "false");
        }
    }

    document.getElementById("lang-btn-en").addEventListener("click", function() {
        if (lang !== "en") { lang = "en"; applyLang(); }
    });
    document.getElementById("lang-btn-es").addEventListener("click", function() {
        if (lang !== "es") { lang = "es"; applyLang(); }
    });

    applyLang();

    // === Form Submission ===
    var form = document.getElementById("support-form");
    var submitBtn = document.getElementById("submit-btn");
    var formMsg = document.getElementById("form-msg");

    form.addEventListener("submit", async function(e) {
        e.preventDefault();

        var turnstileToken = document.querySelector(".cf-turnstile")?.getAttribute("data-token") ||
            (window.turnstile ? window.turnstile.getResponse() : null);
        if (!turnstileToken) {
            showMsg("msg-captcha", "error");
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = t("msg-sending");
        formMsg.className = "text-sm font-medium text-center hidden";

        try {
            var res = await fetch("/api/support", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    name: document.getElementById("name").value.trim(),
                    email: document.getElementById("email").value.trim(),
                    subject: document.getElementById("subject").value.trim(),
                    category: document.getElementById("category").value,
                    message: document.getElementById("message").value.trim(),
                    turnstileToken: turnstileToken
                })
            });

            if (res.ok) {
                window.location.href = "/support/thanks";
            } else {
                var data = await res.json().catch(function() { return {}; });
                showMsg(data.error ? data.error : "msg-error", "error");
            }
        } catch (err) {
            showMsg("msg-error", "error");
        }

        submitBtn.disabled = false;
        submitBtn.textContent = t("btn-submit");
    });

    function showMsg(key, type) {
        formMsg.textContent = t(key);
        formMsg.className = "text-sm font-medium text-center " + (type === "success" ? "text-[#4ADE80]" : "text-brand-accent");
        formMsg.style.display = "block";
    }
    </script>
</body>
</html>
