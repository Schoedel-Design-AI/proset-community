<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You — Proset</title>
    <meta name="description" content="Your support ticket has been submitted." />
    <meta name="theme-color" content="#0A1628" />
    <meta name="robots" content="noindex" />
    <link rel="stylesheet" href="/landing-page.css?v=5" />
</head>
<body class="bg-brand-background text-brand-text antialiased font-sans min-h-screen flex flex-col">
    <!-- Nav -->
    <nav class="w-full border-b border-brand-border bg-brand-surface/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="/" class="flex items-center gap-2">
                <img src="/aiforms-logo-v2.png" alt="Proset Logo" width="40" height="40"
                    class="h-10 w-10 rounded-xl object-cover border border-brand-border/50 shadow-sm" />
                <span class="text-xl font-bold tracking-tight">Proset</span>
            </a>
        </div>
    </nav>

    <!-- Thank You -->
    <main class="flex-1 flex items-center justify-center px-4 py-10">
        <div class="text-center max-w-md">
            <!-- Checkmark -->
            <div class="mx-auto mb-8 w-20 h-20 rounded-full flex items-center justify-center" style="background: rgba(0,180,216,0.15);">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#00B4D8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
            </div>

            <h1 class="text-3xl md:text-4xl font-bold tracking-tight text-white mb-4">Thank You!</h1>
            <p class="text-brand-textSecondary text-lg leading-relaxed mb-8">
                Your support ticket has been submitted. We'll review it and get back to you soon — usually within 24 hours.
            </p>
            <p class="text-brand-textMuted text-sm mb-10">
                A confirmation has been sent to your email address.
            </p>

            <a href="/support" class="inline-block px-8 py-4 font-semibold text-lg transition-all hover:-translate-y-0.5"
                style="background:#00B4D8; color:#FFFFFF; border:none;">
                Submit Another Ticket
            </a>
            <p class="mt-8">
                <a href="/" class="text-brand-textSecondary hover:text-brand-text transition-colors text-sm">← Back to Proset</a>
            </p>
        </div>
    </main>
</body>
</html>
