<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proset — Be Right Back</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0A1628;
      color: #F0F4F8;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
    }
    .card {
      background: #12223E;
      border: 1px solid #1E3355;
      border-radius: 1.5rem;
      padding: 3rem 2.5rem;
      max-width: 480px;
      width: 100%;
    }
    .logo {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: linear-gradient(135deg, #00B4D8, #0077B6);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      color: #fff;
    }
    p {
      color: #7A8EA0;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 1.25rem;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(0,180,216,0.1);
      border: 1px solid rgba(0,180,216,0.2);
      border-radius: 100px;
      padding: 0.5rem 1.25rem;
      font-size: 0.85rem;
      color: #00B4D8;
      margin-bottom: 1.75rem;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00B4D8;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    .links {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .links a {
      color: #00B4D8;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      transition: background 0.2s;
    }
    .links a:hover { background: rgba(0,180,216,0.1); }
    footer {
      margin-top: 2rem;
      color: #4A5E78;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">P</div>
    <div class="status">
      <span class="status-dot"></span>
      Server restarting — back in a moment
    </div>
    <h1>Matrix Chat</h1>
    <p>
      This service is temporarily offline, most likely due to a brief power
      cycle at the host location. It comes back automatically and usually takes
      less than five minutes.
    </p>
    <div class="links">
      <a href="https://proset.ai">Proset App</a>
      <a href="https://github.com/schoedel-learn">GitHub</a>
    </div>
    <footer>If this persists, contact barry@proset.ai</footer>
  </div>
</body>
</html>
